# MiraFactions FTop material valuation
#
# MiraShop is the primary source of normal item values.
# Spawners continue to use MiraShop's typed spawner buy-price service.
#
# IMPORTANT:
# Only materials listed under counted-placed-materials contribute value when
# physically placed in claimed land. This prevents normal building blocks,
# natural terrain, and shop-priced utility blocks from inflating FTop.
source: BUY

fallback-to-essentials-worth: false

# Placed blocks that count toward FTop.
# Keep this intentionally small: classic faction wealth blocks only.
counted-placed-materials:
  - IRON_BLOCK
  - GOLD_BLOCK
  - EMERALD_BLOCK
  - DIAMOND_BLOCK
  - NETHERITE_BLOCK

# These override the selected MiraShop price for both container valuation and
# placed value blocks.
overrides:
  # IRON_BLOCK: 750.0
  # GOLD_BLOCK: 1200.0
  # EMERALD_BLOCK: 2500.0
  # DIAMOND_BLOCK: 22500.0
  # NETHERITE_BLOCK: 292500.0

# These NEVER add FTop value, even if present above or priced by MiraShop.
# SPAWNER is handled separately through typed spawner valuation.
exclude-materials:
  - AIR
  - CAVE_AIR
  - VOID_AIR
  - WATER
  - LAVA
  - BEDROCK
  - BARRIER
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - STRUCTURE_BLOCK
  - STRUCTURE_VOID
  - JIGSAW
  - LIGHT
  - SPAWNER
