name: Release v0.2.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.8 \
            build/libs/MiraFactions-0.2.8.jar \
            --target "${{ github.sha }}" \
            --title "MiraFactions v0.2.8" \
            --notes "Adds /fa claim <Faction> <Amount>, /fa autoclaim <Faction>, and comprehensive SafeZone/WarZone protection hardening including mob-spawn blocking, SafeZone damage immunity, projectile/throwable/spawn-egg restrictions, explosion protection, and a protected-zone bypass permission."
