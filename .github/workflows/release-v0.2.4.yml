name: Release v0.2.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 6288d27529eaf66a8ba4a8978381382bc5b9a177
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.4 \
            build/libs/MiraFactions-0.2.4.jar \
            --target 6288d27529eaf66a8ba4a8978381382bc5b9a177 \
            --title "MiraFactions v0.2.4" \
            --notes "Faction wealth update. /f value now shows total wealth, spawner land value, faction bank value, total placed spawners and a typed stacked-spawner breakdown. /f top is now a wealth leaderboard ranked by spawner land value plus faction bank balance, while using MiraShop typed spawner buy values with Essentials fallback."
