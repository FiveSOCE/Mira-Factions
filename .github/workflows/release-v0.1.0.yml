name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: fa2317c35e2159bd7f4425be5917f5cbd1af45af
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            build/libs/MiraFactions-0.1.0.jar \
            --target fa2317c35e2159bd7f4425be5917f5cbd1af45af \
            --title "MiraFactions v0.1.0" \
            --notes "Initial MiraFactions core release for Paper 1.21.11: GUI-first faction creation/management, Member-Officer-Coleader-Leader ranks, invites, promotions, leadership transfer, chunk claims, player/faction power, power loss/regeneration, claimed-land protection, faction homes, faction chat, Ally/Enemy/Neutral diplomacy, friendly-fire protection, territory feedback and persistent YAML storage."
