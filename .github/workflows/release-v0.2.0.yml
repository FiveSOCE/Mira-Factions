name: Release v0.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 0d2a234c0f2bb9cf6b9c65f318dd64e1ee07f2b0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 \
            build/libs/MiraFactions-0.2.0.jar \
            --target 0d2a234c0f2bb9cf6b9c65f318dd64e1ee07f2b0 \
            --title "MiraFactions v0.2.0" \
            --notes "Major command-first warfare rebuild. Adds Recruit rank, Truce diplomacy, expiring invites, bans/open factions, direct roles/titles/descriptions/links, enemy overclaiming and raidable territory, granular faction and relation permissions, SafeZone/WarZone, radius/auto claims, map/seechunk, faction warps, Vault-backed faction bank, TNT bank, shields/grace, native faction vault, faction upgrades, faction flight, zones, dues/rent foundations, faction/ally/truce chat, faction top/near/coords/stuck utilities, PlaceholderAPI expansion, public MiraFactions API, admin warfare controls, piston/liquid/hopper border protection and functional territory/combat/mob/crop/spawner upgrades."
