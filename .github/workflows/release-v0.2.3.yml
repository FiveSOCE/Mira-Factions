name: Release v0.2.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 01d1027d03d2febace64f03b9dd6a6e45c014271
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.3 \
            build/libs/MiraFactions-0.2.3.jar \
            --target 01d1027d03d2febace64f03b9dd6a6e45c014271 \
            --title "MiraFactions v0.2.3" \
            --notes "Supersedes v0.2.2 with stable uncapped operator power. Includes /f list <page> with 10 factions per page, spawner-based faction land value using MiraShop typed spawner prices with Essentials fallback, normal 25 player power, a larger 17x17 /f map, and /fa power <player> <amount>. Operator-set out-of-range power persists through normal regeneration; deaths reduce the uncapped value normally instead of snapping it back to the standard cap."
