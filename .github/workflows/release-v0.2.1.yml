name: Release v0.2.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 67e7525f28511bc9f2090537dab2c76f7399d46e
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.1 \
            build/libs/MiraFactions-0.2.1.jar \
            --target 67e7525f28511bc9f2090537dab2c76f7399d46e \
            --title "MiraFactions v0.2.1" \
            --notes "Operator and map QoL update. Expands /fa with chat spy, force join/kick/role/home, faction rename/info, player power, faction power boosts, permanent power, faction money/TNT controls, peaceful/permanent/rent-exempt flags, grace, shield reset, upgrade administration and tab completion. Adds /f map auto and /f automap so the relation map redraws whenever the player enters a new chunk."
