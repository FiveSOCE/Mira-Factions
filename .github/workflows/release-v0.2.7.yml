name: Release v0.2.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: fc345b493a0019062d8b4b7a88f64e0c2fba527a
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.7 \
            build/libs/MiraFactions-0.2.7.jar \
            --target fc345b493a0019062d8b4b7a88f64e0c2fba527a \
            --title "MiraFactions v0.2.7" \
            --notes "MiraFly integration update. MiraFactions now exposes faction-flight entitlement and territory APIs and delegates /f fly runtime control to MiraFly through the FactionFlightController service interface."
