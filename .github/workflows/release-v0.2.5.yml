name: Release v0.2.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: d3fc4bfdf85d1edf98e6c2e89e9bdab05c6b4329
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.5 \
            build/libs/MiraFactions-0.2.5.jar \
            --target d3fc4bfdf85d1edf98e6c2e89e9bdab05c6b4329 \
            --title "MiraFactions v0.2.5" \
            --notes "Faction intelligence update. Adds persistent faction audit logs, faction bank transaction history, faction value history, raid value loss/gain logging, operator and upgrade auditing, and FTop PlaceholderAPI placeholders for ranks 1-10. Value history tracks spawner land value plus faction bank wealth and is stored separately from core faction state."
