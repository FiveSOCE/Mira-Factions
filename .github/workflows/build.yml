name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraFactions-0.2.13
          path: build/libs/MiraFactions-0.2.13.jar
      - name: Publish v0.2.13 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.13 >/dev/null 2>&1; then
            gh release create v0.2.13 \
              build/libs/MiraFactions-0.2.13.jar \
              --target "${{ github.sha }}" \
              --title "MiraFactions v0.2.13" \
              --notes "Fixes the duplicate faction-territory permission check that still blocked chests, barrels, ender chests, anvils and enchanting tables in SafeZone/WarZone. Utility access now bypasses both relevant interaction protection layers while land/combat rules remain unchanged."
          fi
