name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraFactions-0.2.10
          path: build/libs/MiraFactions-0.2.10.jar
      - name: Publish v0.2.10 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.10 >/dev/null 2>&1; then
            gh release create v0.2.10 \
              build/libs/MiraFactions-0.2.10.jar \
              --target "${{ github.sha }}" \
              --title "MiraFactions v0.2.10" \
              --notes "Protected-zone hardening release. Extends SafeZone and WarZone protection across direct build/break, buckets, fluids, pistons, fire, dispensers, hanging/entity manipulation, hopper movement, entity block changes and SafeZone hostile potion/effect paths while retaining existing projectile, spawn and damage protections."
          fi
