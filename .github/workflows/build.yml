name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraFactions-0.2.12
          path: build/libs/MiraFactions-0.2.12.jar
      - name: Publish v0.2.12 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.12 >/dev/null 2>&1; then
            gh release create v0.2.12 \
              build/libs/MiraFactions-0.2.12.jar \
              --target "${{ github.sha }}" \
              --title "MiraFactions v0.2.12" \
              --notes "Protected-zone utility interaction update. SafeZone and WarZone now allow chests, trapped chests, barrels, ender chests, anvils and enchanting tables while preserving existing SafeZone combat protection and WarZone terrain protection."
          fi
