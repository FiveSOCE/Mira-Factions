name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraFactions-0.2.11
          path: build/libs/MiraFactions-0.2.11.jar
      - name: Publish v0.2.11 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.11 >/dev/null 2>&1; then
            gh release create v0.2.11 \
              build/libs/MiraFactions-0.2.11.jar \
              --target "${{ github.sha }}" \
              --title "MiraFactions v0.2.11" \
              --notes "WarZone combat-policy update. WarZone now allows normal PvP, bows, crossbows, tridents, ender pearls, throwables, potions and entity interaction while preserving terrain protection against building, fluids, pistons, fire and explosion block damage. SafeZone remains fully protected."
          fi
