name: Build

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: gradle clean build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MiraFactions-${{ steps.version.outputs.version }}
          path: build/libs/MiraFactions-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          JAR="build/libs/MiraFactions-$VERSION.jar"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$JAR" \
              --target "${{ github.sha }}" \
              --title "MiraFactions $TAG" \
              --notes "FTop now values placed and stored spawners, configured/Essentials-worth materials, valuable blocks, chest/barrel contents and nested shulkers across faction claims. Live asset changes refresh the affected claim cache and /fa top update performs a full batched rebuild."
          fi
