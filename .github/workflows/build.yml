name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraFactions-0.2.15
          path: build/libs/MiraFactions-0.2.15.jar
      - name: Publish v0.2.15 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.15 >/dev/null 2>&1; then
            gh release create v0.2.15 \
              build/libs/MiraFactions-0.2.15.jar \
              --target "${{ github.sha }}" \
              --title "MiraFactions v0.2.15" \
              --notes "Adds the planned faction permission GUI, faction shield control GUI, Home Warmup and Warp Warmup functional upgrades, clearer upgrade categories/effects, permission reset support and raidability-safe shield activation."
          fi
