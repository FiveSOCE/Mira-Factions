name: Release v0.2.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 89159422b3694b0d638f8352e80eba47b7f88d3e
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.2 \
            build/libs/MiraFactions-0.2.2.jar \
            --target 89159422b3694b0d638f8352e80eba47b7f88d3e \
            --title "MiraFactions v0.2.2" \
            --notes "Adds /f list <page> with 10 factions per page, spawner-based faction land value using MiraShop typed spawner buy prices with Essentials fallback, increases normal player power to 25, expands the faction map radius, and adds simplified uncapped /fa power <player> <amount> operator edits so admin-set power can exceed normal player limits."
